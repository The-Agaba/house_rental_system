spring:
  application:
    name: house_rental

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/house_rental}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 32

  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: true
    # Added baseline configurations to force startup matching on non-empty schema public
    baseline-on-migrate: true
    baseline-version: "6"

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@rentalhub.com}
    password: ${MAIL_PASSWORD:dev-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  homepage-url: ${APP_HOMEPAGE_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-key-32-bytes-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  uploads:
    dir: ${UPLOAD_DIR:./house_rental_uploads}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:dev}
    api-key: ${CLOUDINARY_API_KEY:dev}
    api-secret: ${CLOUDINARY_API_SECRET:dev}

logging:
  level:
    root: INFO
    org:
      springframework: INFO
      hibernate: INFO