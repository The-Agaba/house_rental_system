<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}House Rental Pro{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-glass sticky-top">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="/">House Rental Pro</a>
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <a class="nav-link" href="/properties">Explore</a>
            {% if user %}
            <a class="nav-link" href="/dashboard">Dashboard</a>
            <a class="btn btn-sm btn-outline-light" href="/logout">Logout</a>
            {% else %}
            <a class="nav-link" href="/login">Login</a>
            <a class="btn btn-sm btn-light" href="/register">Get Started</a>
            {% endif %}
            <a class="nav-link" href="/docs">API Docs</a>
        </div>
    </div>
</nav>
<main class="container py-4 py-md-5">
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
