{% extends "base.html" %}
{% block title %}Login | House Rental Pro{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card card-soft">
            <div class="card-body">
                <h3 class="card-title mb-1">Welcome back</h3>
                <p class="text-muted">Sign in to access your dashboard.</p>
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form method="post" action="/login">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Login</button>
                </form>
                <p class="mt-3 mb-0 text-muted">No account yet? <a href="/register">Register now</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
